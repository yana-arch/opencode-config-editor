name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Lint + tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build (runs pytest suite)
        run: python3 build.py

      - name: Ruff (built artifact + build script + tests)
        run: ruff check

      - name: Coverage report
        run: python3 -m pytest tests/ -q --cov=. --cov-report=term
